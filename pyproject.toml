[project]
name = "carsharing-api"
version = "1.0.0"
description = "Carsharing / Rental API — сервис аренды автомобилей"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
